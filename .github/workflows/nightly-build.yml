name: Nightly ISO Build

on:
  schedule:
    - cron: '1 0 * * *'  # Daily at 00:01 UTC
  push:
    branches:
      - custom
  workflow_dispatch:  # Allow manual triggering

jobs:
  build-iso:
    runs-on: ubuntu-latest

    container:
      image: archlinux/archlinux:latest
      options: --privileged

    steps:
    - name: Install Git
      run: pacman -Sy --noconfirm git

    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Build ISO
      env:
        ZYRO_INSTALLER_REPO: basecamp/omarchy
        ZYRO_INSTALLER_REF: master
        ZYRO_MIRROR: stable
      run: |
        ln -s "$GITHUB_WORKSPACE/configs" /configs
        ln -s "$GITHUB_WORKSPACE/builder" /builder
        ln -s "$GITHUB_WORKSPACE/archiso" /archiso
        mkdir -p /out
        bash builder/build-iso.sh

    - name: Upload ISO artifact
      uses: actions/upload-artifact@v4
      with:
        name: zyro-iso-${{ github.run_number }}
        path: /out/*.iso
        retention-days: 30
